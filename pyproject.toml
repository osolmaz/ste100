[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ste100"
version = "0.1.0"
description = "Offline deterministic checks for ASD-STE100 Issue 9"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Onur Solmaz" }]
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
spacy = ["spacy==3.8.11"]

[project.scripts]
ste100 = "ste100.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ste100"]

[dependency-groups]
dev = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "mypy>=1.16,<2",
    "mutmut>=3.3,<4",
    "pip-audit>=2.9,<3",
    "pytest>=9,<10",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<0.17",
    "spacy==3.8.11",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C90", "ANN", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "spacy"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/ste100"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mutmut]
source_paths = ["src/ste100/schemas.py"]
also_copy = [
    "src/ste100/checker.py",
    "src/ste100/curate.py",
    "src/ste100/document.py",
    "src/ste100/extract.py",
    "src/ste100/linguistics.py",
    "src/ste100/models.py",
    "src/ste100/py.typed",
    "src/ste100/rule_ids.py",
    "src/ste100/standard.py",
    "src/ste100/terminology.py",
]
pytest_add_cli_args_test_selection = ["tests/test_schema_contract.py"]
